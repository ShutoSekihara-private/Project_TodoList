<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <!-- ページアイコン（ファビコン）の設定 -->
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="favicon.png" alt="Logo" class="app-logo">
      <h1>Todo List</h1>
    </div>

    <!-- 1. タスク作成フォーム -->
    <form id="todo-form" class="todo-form">
      <input type="text" id="task-input" placeholder="タスク内容を入力" required>
      <input type="date" id="due-input" required>
      <button type="submit" id="add-btn">+</button>
    </form>

    <!-- 2. ボタン下部の達成率・進捗バー -->
    <div class="progress-section">
      <div class="progress-info">
        <span>達成率</span>
        <span id="progress-percentage">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div id="progress-bar-fill" class="progress-bar-fill"></div>
      </div>
      <div class="task-count-text">
        完了: <span id="completed-count">0</span> / 全体: <span id="total-count">0</span>
      </div>
    </div>

    <!-- 3. タスク一覧表示枠 -->
    <ul id="todo-list" class="todo-list"></ul>
  </div>

  <!-- 完了時ポップアップアニメーション -->
  <div id="toast" class="toast">お疲れさまでした！🎉</div>

  <script src="script.js"></script>
</body>
</html>
