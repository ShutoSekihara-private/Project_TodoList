<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>できたことリスト</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>🌟 今日できたことリスト 🌟</h1>
  <div class="badge-row">
    <div class="count-badge">達成数：<span id="doneCount">0</span> 個</div>
    <div class="count-badge rate-badge">達成率：<span id="rateValue">0</span>%</div>
  </div>
</header>

<main>
  <section class="panel" id="doneSection">
    <h2>できたこと</h2>
    <ul id="doneList"></ul>
    <p class="empty-msg" id="doneEmptyMsg">まだないよ。1つやってみよう！</p>
  </section>

  <section class="panel" id="todoSection">
    <h2>今日やること</h2>
    <ul id="todoList"></ul>
    <p class="empty-msg" id="todoEmptyMsg">下から追加してね📝</p>
  </section>

  <section class="panel" id="futureSection">
    <h2>今後やること</h2>
    <ul id="futureList"></ul>
    <p class="empty-msg" id="futureEmptyMsg">先の予定はまだないよ</p>
  </section>
</main>

<footer>
  <div class="input-row">
    <input type="text" id="taskInput" placeholder="今日やることを入力…" maxlength="60">
    <input type="date" id="dateInput" aria-label="期日">
    <button id="addBtn" aria-label="追加">＋</button>
  </div>
</footer>

<div id="praiseOverlay">
  <div id="praiseText"></div>
  <div id="otsukareText">お疲れさま！</div>
</div>

<script src="script.js"></script>
</body>
</html>
